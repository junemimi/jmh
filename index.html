<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/x-icon" href="images/favicons/matcha.ico">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <section class="home">
        <div class="content">
            <div class="home-nav-section">
                <a href="about.html" class="home-nav-link">
                    <div class="home-nav-icon">🧘🏻‍♀️</div>
                    <span>about</span>
                </a>
                <a href="work.html" class="home-nav-link">
                    <div class="home-nav-icon">💻</div>
                    <span>work</span>
                </a>
                <a href="play.html" class="home-nav-link">
                    <div class="home-nav-icon">🍰</div>
                    <span>play</span>
                </a>
                <button class="home-nav-link mode-toggle">
                    <div class="home-nav-icon mode-icon">☀️</div>
                    <span>mode</span>
                </button>
            </div>
            <h1>june mi hong</h1>
            <h2>software developer</h2>
            <div class="bottom-section">
                <a href="mailto:junemihong@gmail.com" class="email-link">
                    <div class="email-icon">💌</div>
                    <span>email</span>
                </a>
                <div class="desc-image-container">
                    <span class="footer-desc-text">made with love<br>and matcha</span>
                    <div class="image"></div>
                </div>
            </div>
        </div>

        <!-- Louie's own section: he roams on the left, his menu sits on the right (louie.js) -->
        <div class="home-louie">
            <div class="louie-yard"></div>
            <nav class="louie-menu" aria-label="Play with Louie">
                <button type="button" class="louie-menu-item" data-louie="bed">send louie to bed</button>
                <button type="button" class="louie-menu-item" data-louie="feed">feed louie</button>
                <button type="button" class="louie-menu-item" data-louie="fetch">play fetch</button>
                <button type="button" class="louie-menu-item" data-louie="zoomies">zoomies!</button>
                <button type="button" class="louie-menu-item" data-louie="wake" hidden>wake up louie</button>
            </nav>
        </div>
    </section>

    <script src="script.js"></script>
    <script src="louie.js"></script>

</body>
</html>
